version: '3.8'

services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/SessionDb
      - REDIS_URL=redis://redis:6379

  redis:
    image: redis:alpine
    container_name: session-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    container_name: session-mongodb
    ports:
      - "27017:27017"

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_NAME=Local-Redis
    depends_on:
      - redis

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
